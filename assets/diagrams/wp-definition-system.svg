<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716C"/>
    </marker>
  </defs>

  <!-- registry envelope -->
  <rect x="24" y="20" width="912" height="546" rx="8" fill="#F4EFEC" stroke="#E7E0DB" stroke-width="1.4"/>
  <text x="48" y="48" font-family="'JetBrains Mono', monospace" font-size="11.5" letter-spacing="2.2" fill="#1B1620" font-weight="500">REGISTRY</text>
  <text x="912" y="48" text-anchor="end" font-size="11.5" fill="#78716C">every kind: versioned &#183; tenant-scoped &#183; one storage envelope &#183; referenced by name</text>

  <!-- agent card -->
  <rect x="264" y="70" width="432" height="188" rx="6" fill="#FFFFFF" stroke="#1B1620" stroke-width="1.5"/>
  <text x="288" y="99" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#AD2E5C">AGENT</text>
  <text x="288" y="124" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="600" fill="#1B1620">payments-expert</text>
  <text x="672" y="99" text-anchor="end" font-size="10.5" fill="#78716C">mode: task &#183; model: anthropic:claude-opus-4-8</text>
  <line x1="288" y1="136" x2="672" y2="136" stroke="#F0E9E4" stroke-width="1"/>
  <g font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#3F3A44">
    <text x="288" y="157">tools:     [lookup_order]</text>
    <text x="288" y="175">mcp:       payments &#8594; include: [issue_refund, get_balance]</text>
    <text x="288" y="193">knowledge: acme-support-kb &#8594; search: yes &#183; learn: no</text>
    <text x="288" y="211">skills:    [refund-checklist]   playbook: refund-flow</text>
  </g>
  <rect x="276" y="224" width="408" height="24" rx="4" fill="#FBF6F8"/>
  <text x="480" y="240" text-anchor="middle" font-size="10.5" fill="#AD2E5C">carried inside the definition: policy (<tspan font-weight="600">MAY</tspan>) &#183; sandbox (<tspan font-weight="600">WHERE</tspan>) &#183; memory (<tspan font-weight="600">LEARNS</tspan>)</text>

  <!-- fan-out elbows -->
  <g stroke="#78716C" stroke-width="1.2" fill="none">
    <path d="M320,258 v46 H128 v42" marker-end="url(#da)"/>
    <path d="M400,258 v56 H304 v32" marker-end="url(#da)"/>
    <path d="M480,258 v88" marker-end="url(#da)"/>
    <path d="M560,258 v56 H656 v32" marker-end="url(#da)"/>
    <path d="M640,258 v46 H832 v42" marker-end="url(#da)"/>
  </g>

  <!-- kind cards -->
  <!-- TOOL -->
  <rect x="48" y="350" width="160" height="158" rx="6" fill="#FFFFFF" stroke="#E7E0DB" stroke-width="1.2"/>
  <text x="64" y="376" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#1B1620" font-weight="500">TOOL</text>
  <text x="64" y="398" font-size="11.5" font-weight="600" fill="#1B1620">issue_refund</text>
  <text x="64" y="418" font-size="10.5" fill="#3F3A44">JSON-Schema contract</text>
  <text x="64" y="435" font-size="10.5" fill="#3F3A44">impl: kernel &#183; mcp &#183; code</text>
  <text x="64" y="452" font-size="10.5" fill="#3F3A44">action labels + derive</text>
  <text x="64" y="469" font-size="10.5" fill="#3F3A44">rules (amount &gt; 500)</text>
  <rect x="48" y="484" width="160" height="24" rx="0" fill="#FBF6F8"/>
  <text x="128" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#AD2E5C">WHAT IT CAN DO</text>

  <!-- MCP SERVER -->
  <rect x="224" y="350" width="160" height="158" rx="6" fill="#FFFFFF" stroke="#E7E0DB" stroke-width="1.2"/>
  <text x="240" y="376" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#1B1620" font-weight="500">MCP SERVER</text>
  <text x="240" y="398" font-size="11.5" font-weight="600" fill="#1B1620">payments</text>
  <text x="240" y="418" font-size="10.5" fill="#3F3A44">registered catalog entry</text>
  <text x="240" y="435" font-size="10.5" fill="#3F3A44">include-scoped mount:</text>
  <text x="240" y="452" font-size="10.5" fill="#3F3A44">new tools NOT granted</text>
  <text x="240" y="469" font-size="10.5" fill="#3F3A44">auth brokered, never stored</text>
  <rect x="224" y="484" width="160" height="24" fill="#FBF6F8"/>
  <text x="304" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#AD2E5C">WHAT IT REACHES</text>

  <!-- KNOWLEDGE -->
  <rect x="400" y="350" width="160" height="158" rx="6" fill="#FFFFFF" stroke="#E7E0DB" stroke-width="1.2"/>
  <text x="416" y="376" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#1B1620" font-weight="500">KNOWLEDGE</text>
  <text x="416" y="398" font-size="11.5" font-weight="600" fill="#1B1620">acme-support-kb</text>
  <text x="416" y="418" font-size="10.5" fill="#3F3A44">search = an access</text>
  <text x="416" y="435" font-size="10.5" fill="#3F3A44">learn = a governed write</text>
  <text x="416" y="452" font-size="10.5" fill="#3F3A44">mints search_* / learn_*</text>
  <text x="416" y="469" font-size="10.5" fill="#3F3A44">tools per base</text>
  <rect x="400" y="484" width="160" height="24" fill="#FBF6F8"/>
  <text x="480" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#AD2E5C">WHAT IT KNOWS</text>

  <!-- SKILL -->
  <rect x="576" y="350" width="160" height="158" rx="6" fill="#FFFFFF" stroke="#E7E0DB" stroke-width="1.2"/>
  <text x="592" y="376" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#1B1620" font-weight="500">SKILL</text>
  <text x="592" y="398" font-size="11.5" font-weight="600" fill="#1B1620">refund-checklist</text>
  <text x="592" y="418" font-size="10.5" fill="#3F3A44">SKILL.md bundle —</text>
  <text x="592" y="435" font-size="10.5" fill="#3F3A44">AgentSkills.io standard</text>
  <text x="592" y="452" font-size="10.5" fill="#3F3A44">instructions + scripts +</text>
  <text x="592" y="469" font-size="10.5" fill="#3F3A44">references, loaded on need</text>
  <rect x="576" y="484" width="160" height="24" fill="#FBF6F8"/>
  <text x="656" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#AD2E5C">HOW TO DO IT</text>

  <!-- PLAYBOOK -->
  <rect x="752" y="350" width="160" height="158" rx="6" fill="#FFFFFF" stroke="#E7E0DB" stroke-width="1.2"/>
  <text x="768" y="376" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.6" fill="#1B1620" font-weight="500">PLAYBOOK</text>
  <text x="768" y="398" font-size="11.5" font-weight="600" fill="#1B1620">refund-flow</text>
  <text x="768" y="418" font-size="10.5" fill="#3F3A44">enforced procedure —</text>
  <text x="768" y="435" font-size="10.5" fill="#3F3A44">steps + expected_tools</text>
  <text x="768" y="452" font-size="10.5" fill="#3F3A44">deviations recorded as</text>
  <text x="768" y="469" font-size="10.5" fill="#3F3A44">events on the trace</text>
  <rect x="752" y="484" width="160" height="24" fill="#FBF6F8"/>
  <text x="832" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1.2" fill="#AD2E5C">WHAT MUST HAPPEN</text>

  <text x="480" y="544" text-anchor="middle" font-size="10.5" fill="#78716C" font-style="italic">References are names, validated at publication — a dangling reference is caught at the airlock, not at runtime.</text>
</svg>
