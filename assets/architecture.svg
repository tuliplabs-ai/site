<svg viewBox="0 0 680 634" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">

  <!-- ── THE CONTROL PLANE ──────────────────────────────────────────────── -->
  <rect x="90" y="16" width="500" height="112" rx="14" fill="#17141C"/>
  <text x="114" y="46" font-size="10.5" letter-spacing="2" fill="#9A90A5">THE CONTROL PLANE · TULIP-HOSTED</text>
  <text x="114" y="72" font-size="16.5" font-weight="600" fill="#FFFFFF">Studio + Registry</text>
  <text x="114" y="93" font-size="11.5" fill="#C9C2D0">define agents, policies, connections · certify versions · review holds</text>
  <text x="114" y="112" font-size="11" font-style="italic" fill="#9A90A5">runs no agents — the catalog and the cockpit</text>

  <!-- ── the boundary ───────────────────────────────────────────────────── -->
  <line x1="36" y1="170" x2="644" y2="170" stroke="#D6336C" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="44" y="190" font-size="10" font-family="JetBrains Mono,monospace" letter-spacing="1" fill="#AD2E5C">THE BOUNDARY — YOUR DATA NEVER CROSSES UP</text>

  <!-- crossing arrows -->
  <defs>
    <marker id="ink" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#1B1620"/></marker>
    <marker id="mut" markerWidth="9" markerHeight="9" refX="6.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#78716C"/></marker>
  </defs>
  <path d="M330 128 L330 204" stroke="#1B1620" stroke-width="1.6" marker-end="url(#ink)"/>
  <text x="318" y="156" font-size="11" fill="#4A434C" text-anchor="end">definitions + policy, down</text>
  <path d="M420 204 L420 128" stroke="#78716C" stroke-width="1.6" marker-end="url(#mut)"/>
  <text x="432" y="156" font-size="11" fill="#78716C">verdicts · traces · evidence, up</text>

  <!-- ── YOUR ENVIRONMENT ───────────────────────────────────────────────── -->
  <rect x="36" y="204" width="608" height="382" rx="16" fill="#F4EFEC" stroke="#E7E0DB"/>
  <text x="60" y="232" font-size="10.5" letter-spacing="2" fill="#78716C">YOUR ENVIRONMENT · THE DATA PLANE</text>

  <!-- the runtime -->
  <rect x="60" y="248" width="560" height="176" rx="12" fill="#FFFFFF" stroke="#E7E0DB"/>
  <text x="84" y="276" font-size="10.5" letter-spacing="2" fill="#78716C">THE RUNTIME · ONE INSTALLED PROCESS</text>
  <text x="84" y="300" font-size="12.5" fill="#1B1620">the agent loop · your models · credentials injected at call time</text>

  <rect x="84" y="316" width="242" height="34" rx="17" fill="#F4EFEC"/>
  <text x="102" y="338" font-size="11" font-weight="600" letter-spacing="1" fill="#1B1620">THE GATE</text>
  <circle cx="180" cy="333" r="4" fill="#1F7A54"/><text x="189" y="338" font-size="11.5" fill="#4A434C">allow</text>
  <circle cx="235" cy="333" r="4" fill="#B26B00"/><text x="244" y="338" font-size="11.5" fill="#4A434C">hold</text>
  <circle cx="286" cy="333" r="4" fill="#D6336C"/><text x="295" y="338" font-size="11.5" fill="#4A434C">deny</text>

  <rect x="352" y="310" width="248" height="66" rx="12" fill="#FFFFFF" stroke="#D6336C" stroke-width="1.4"/>
  <text x="370" y="333" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#D6336C">Clusiana</text>
  <text x="370" y="350" font-size="10.5" fill="#4A434C">small models advise each decision —</text>
  <text x="370" y="365" font-size="10.5" font-style="italic" fill="#AD2E5C">they can never override your rules</text>

  <text x="84" y="378" font-size="12" fill="#4A434C">every decision → a tamper-evident record</text>
  <text x="84" y="406" font-size="10.5" font-style="italic" fill="#78716C">the engine inside: tulip-agents — open source, Apache-2.0</text>

  <!-- runtime ⇄ sandbox -->
  <path d="M310 424 L310 456" stroke="#1B1620" stroke-width="1.6" marker-end="url(#ink)"/>
  <path d="M370 456 L370 424" stroke="#78716C" stroke-width="1.6" marker-end="url(#mut)"/>

  <!-- the sandbox -->
  <rect x="60" y="456" width="560" height="88" rx="12" fill="#FFFFFF" stroke="#E7E0DB"/>
  <text x="84" y="484" font-size="10.5" letter-spacing="2" fill="#78716C">THE SANDBOX · WHERE MODEL-DIRECTED WORK RUNS</text>
  <text x="84" y="507" font-size="12.5" fill="#1B1620">code · shell · files · browser — a real workspace</text>
  <text x="84" y="527" font-size="12" fill="#4A434C">holds no credentials · network reach declared up front</text>

  <text x="60" y="572" font-size="11" font-style="italic" fill="#78716C">your models, your data, your secrets — they never leave this box</text>

  <!-- caption -->
  <text x="340" y="618" font-size="12" font-style="italic" fill="#78716C" text-anchor="middle">define once, up top · execute here, next to your data · only verdicts cross back</text>
</svg>
